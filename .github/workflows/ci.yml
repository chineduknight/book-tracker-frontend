name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, test, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 26.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # A sentinel, not a real API: the bundle check below proves it never reaches the browser.
          API_BASE_URL: https://bundle-sentinel.invalid/api/v1

      - name: Check the browser bundle for server-only values
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (mobile and desktop Chromium)
        run: npm run test:e2e

      - name: Upload visual walkthrough
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-walkthrough
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
