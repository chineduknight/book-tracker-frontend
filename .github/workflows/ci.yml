name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, test, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      # Disposable store for the BFF session integration and browser tests. Nothing else uses it.
      mongodb:
        image: mongo:8.0
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BFF_SESSION_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
      BACKEND_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
      E2E_SESSION_MONGODB_URI: mongodb://127.0.0.1:27018/avuneri-bff-e2e
      BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7

      # The merged API the library contract was written against, pinned to an exact commit.
      # Bump deliberately when the API changes (see README → Real-backend tests).
      - name: Check out book-tracker-backend (pinned)
        uses: actions/checkout@v7
        with:
          repository: chineduknight/book-tracker-backend
          ref: fea9c12e218f0322714f3e1c3139e494cbf90204
          path: backend
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 26.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      - name: Install the API's dependencies
        run: npm ci
        working-directory: backend
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Session store integration tests (MongoDB 8)
        run: npm run test:integration

      - name: Library contract tests against the real API (MongoDB 8)
        run: npm run test:backend

      - name: Colour contrast of the design tokens
        run: npm run check:contrast

      - name: Build
        run: npm run build
        env:
          # Sentinels, not real services: the bundle check below proves none reaches the browser.
          API_BASE_URL: https://bundle-sentinel.invalid/api/v1
          APP_ORIGIN: https://bundle-sentinel.invalid
          BFF_SESSION_MONGODB_URI: mongodb://bundle-sentinel.invalid/avuneri-bff

      - name: Check the browser bundle for server-only values
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (mobile and desktop Chromium; real API and fake auth API; MongoDB 8)
        run: npm run test:e2e

      - name: Upload visual walkthrough
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-walkthrough
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose
